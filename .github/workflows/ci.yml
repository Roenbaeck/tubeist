name: Tubeist CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/direct-youtube-hls
      - feature/videotoolbox-adaptive-streaming

concurrency:
  group: tubeist-${{ github.ref }}
  cancel-in-progress: true

# The output monitor's HDR preference requires the iOS 26 SDK.
env:
  DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer

jobs:
  source-policy:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Enforce YouTube-only production sources
        run: Tools/check_youtube_only.sh
      - name: Validate property lists
        run: plutil -lint Tubeist/Info.plist Tubeist/PrivacyInfo.xcprivacy
      - name: Parse all Swift sources
        run: xcrun swiftc -frontend -parse Tubeist/*.swift TubeistTests/*.swift TubeistUITests/*.swift
      - name: Test device acceptance tools
        run: python3 -m unittest discover -s Tools/Acceptance -p 'test_*.py'

  tests-and-builds:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Report Xcode version
        run: xcodebuild -version
      - name: Prepare test simulator
        id: simulator
        timeout-minutes: 20
        shell: bash
        env:
          IOS_SIMULATOR_VERSION: '26.2'
        run: |
          if ! xcodebuild -checkFirstLaunchStatus; then
            sudo env DEVELOPER_DIR="$DEVELOPER_DIR" xcodebuild -runFirstLaunch
          fi

          runtime_id="com.apple.CoreSimulator.SimRuntime.iOS-${IOS_SIMULATOR_VERSION//./-}"
          runtime_available() {
            xcrun simctl list runtimes --json | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["runtimes"]
          sys.exit(0 if any(r["identifier"] == sys.argv[1] and r.get("isAvailable", False) for r in runtimes) else 1)
          ' "$runtime_id"
          }
          if ! runtime_available; then
            xcodebuild -downloadPlatform iOS -buildVersion "$IOS_SIMULATOR_VERSION"
          fi
          xcrun simctl list runtimes
          runtime_available

          # Hosted images can omit the default devices. Create our own and use
          # its identifier so device names and duplicate defaults cannot interfere.
          simulator_id="$(xcrun simctl create Tubeist-CI com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro "$runtime_id")"
          echo "udid=$simulator_id" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$simulator_id"
          xcrun simctl bootstatus "$simulator_id" -b
      - name: Unit and UI tests
        run: >-
          xcodebuild test
          -project Tubeist.xcodeproj
          -scheme Tubeist
          -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}'
          -derivedDataPath '${{ runner.temp }}/TubeistDerivedData'
          -parallel-testing-enabled NO
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tubeist-test-results
          path: ${{ runner.temp }}/TubeistDerivedData/Logs/Test/*.xcresult
          if-no-files-found: ignore
          retention-days: 7
      - name: Analyze Debug
        run: >-
          xcodebuild analyze
          -project Tubeist.xcodeproj
          -scheme Tubeist
          -configuration Debug
          -destination 'generic/platform=iOS'
          -derivedDataPath '${{ runner.temp }}/TubeistDerivedData'
          CODE_SIGNING_ALLOWED=NO
      - name: Build generic device Debug
        run: >-
          xcodebuild build
          -project Tubeist.xcodeproj
          -scheme Tubeist
          -configuration Debug
          -destination 'generic/platform=iOS'
          -derivedDataPath '${{ runner.temp }}/TubeistDerivedData'
          CODE_SIGNING_ALLOWED=NO
      - name: Build generic device Release
        run: >-
          xcodebuild build
          -project Tubeist.xcodeproj
          -scheme Tubeist
          -configuration Release
          -destination 'generic/platform=iOS'
          -derivedDataPath '${{ runner.temp }}/TubeistDerivedData'
          CODE_SIGNING_ALLOWED=NO
      - name: Remove test simulator
        if: always() && steps.simulator.outputs.udid != ''
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.udid }}
        run: xcrun simctl delete "$SIMULATOR_ID"

  offline-media-validation:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install FFmpeg
        run: brew install ffmpeg
      - name: Validate generated HLG transport stream
        run: Tools/RemuxFixture/validate_generated_hlg.sh
      - name: Validate recording/archive evidence comparison
        run: Tools/Acceptance/validate_media_comparison.sh
      - name: Validate uploader against local HTTPS mock
        run: Tools/YouTubeHLSMock/validate_uploader_socket.sh
